app-id: org.ohrbob.ohrbob
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: org.ohrbob.ohrbob
sdk-extensions:
  - org.freedesktop.Sdk.Extension.dotnet10
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --share=network
  - --device=dri
cleanup:
  - '*.a'
build-options:
  append-path: /usr/lib/sdk/dotnet10/bin
  append-ld-library-path: /usr/lib/sdk/dotnet10/lib
  env:
    DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
    DOTNET_ROOT: /usr/lib/sdk/dotnet10
    XCURSOR_PATH: /run/host/user-share/icons:/run/host/share/icons
modules:
  - name: ohrbob
    buildsystem: simple
    build-commands:
      - bash scripts/build-flatpak-app.sh
    sources:
      - type: dir
        path: .
        skip:
          - .git
          - .cache
          - .local
          - .idea
          - .superpowers
          - .env
          - .envrc
      - nuget-sources.json
